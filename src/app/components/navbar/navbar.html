<nav class="navbar navbar-expand-lg bg-white shadow-sm fixed-top">
  <div class="container">

    <!-- Logo -->
    <a class="navbar-brand fw-bold" routerLink="/">
      Trip<span>Mate</span>
    </a>

    <!-- Mobile Toggle -->
    <button
      class="navbar-toggler border-0 shadow-none"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation">

      <span class="navbar-toggler-icon"></span>
    </button>

    <div
      class="collapse navbar-collapse"
      id="navbarNav">

      <!-- ========================= -->
      <!-- COMMON LINKS -->
      <!-- ========================= -->

      <ul class="navbar-nav mx-auto">

        <!-- Home -->
        <li class="nav-item" *ngIf="!auth.isAdmin()">
          <a
            class="nav-link"
            routerLink="/home"
            routerLinkActive="active">
            Home
          </a>
        </li>

        <!-- About -->
        <li class="nav-item" *ngIf="!auth.isAdmin()">
          <a
            class="nav-link"
            routerLink="/about"
            routerLinkActive="active">
            About Us
          </a>
        </li>

        <!-- Services -->
        <li class="nav-item" *ngIf="!auth.isAdmin()">
          <a
            class="nav-link"
            routerLink="/services"
            routerLinkActive="active">
            Services
          </a>
        </li>

        <!-- Destinations -->
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/destinations"
            routerLinkActive="active">
            Destinations
          </a>
        </li>


        <!-- ========================= -->
        <!-- USER ONLY -->
        <!-- ========================= -->

        <!-- Contact Us -->
        <li
          class="nav-item"
          *ngIf="auth.isLoggedIn() && !auth.isAdmin()">

          <a
            class="nav-link"
            routerLink="/contact"
            routerLinkActive="active">
            Contact Us
          </a>

        </li>


        <!-- My Complaints -->
        <li
          class="nav-item"
          *ngIf="auth.isLoggedIn() && !auth.isAdmin()">

          <a
            class="nav-link"
            routerLink="/complaints"
            routerLinkActive="active">
            My Complaints
          </a>

        </li>


        <!-- User Chat -->
        <li
          class="nav-item"
          *ngIf="auth.isLoggedIn() && !auth.isAdmin()">

          <a
            class="nav-link"
            routerLink="/chat"
            routerLinkActive="active">
            Chat
          </a>

        </li>


        <!-- ========================= -->
        <!-- ADMIN ONLY -->
        <!-- ========================= -->

        <!-- Admin Dashboard -->
        <li
          class="nav-item"
          *ngIf="auth.isLoggedIn() && auth.isAdmin()">

          <a
            class="nav-link"
            routerLink="/admin"
            routerLinkActive="active">
            Dashboard
          </a>

        </li>


        <!-- Admin Complaints -->
        <li
          class="nav-item"
          *ngIf="auth.isLoggedIn() && auth.isAdmin()">

          <a
            class="nav-link"
            routerLink="/all-complaints"
            routerLinkActive="active">
            Complaints
          </a>

        </li>


        <!-- Admin Chat -->
        <li
          class="nav-item"
          *ngIf="auth.isLoggedIn() && auth.isAdmin()">

          <a
            class="nav-link"
            routerLink="/admin/chat"
            routerLinkActive="active">
            Chat
          </a>

        </li>

      </ul>


      <!-- ========================= -->
      <!-- RIGHT SIDE -->
      <!-- ========================= -->

      <div class="d-flex gap-2">

        <!-- NOT LOGGED IN -->
        <ng-container
          *ngIf="!auth.isLoggedIn(); else loggedIn">

          <button
            class="btn login-btn"
            routerLink="/login">
            Login
          </button>

          <button
            class="btn login-btn"
            routerLink="/signup">
            Sign Up
          </button>

        </ng-container>


        <!-- LOGGED IN -->
        <ng-template #loggedIn>

          <!-- USER PROFILE ONLY -->
          <button
            *ngIf="!auth.isAdmin()"
            class="btn login-btn"
            routerLink="/profile">
            Profile
          </button>


          <!-- LOGOUT -->
          <button
            class="btn btn-outline-danger"
            (click)="logout()">
            Logout
          </button>

        </ng-template>

      </div>

    </div>
  </div>
</nav>
