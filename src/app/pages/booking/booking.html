
<section class="booking-page">

  <div class="booking-card">

    <!-- Destination Header -->

    <div class="destination-header">

      <small>
        Booking for
      </small>

      <h2>
        {{ destination?.name }}
      </h2>

      <p>
        {{ destination?.country }}
      </p>

    </div>


    <div class="booking-content">

      <!-- User Information -->

      <div class="booking-section">

        <h3>
          Your Information
        </h3>

        <div class="user-info">

          <!-- Name -->

          <div class="info-box">

            <span>
              Name
            </span>

            <input
              type="text"
              name="userName"
              [(ngModel)]="user.name"
              placeholder="Enter your name"
            />

          </div>


          <!-- Email -->

          <div class="info-box">

            <span>
              Email
            </span>

            <input
              type="email"
              name="userEmail"
              [(ngModel)]="user.email"
              readonly
            />

          </div>


          <!-- Phone -->

          <div class="info-box">

            <span>
              Phone
            </span>

            <input
              type="tel"
              name="userPhone"
              [(ngModel)]="user.phone"
              placeholder="Enter your phone number"
            />

          </div>

        </div>

      </div>


      <div class="divider"></div>


      <!-- Trip Information -->

      <div class="booking-section">

        <h3>
          Trip Information
        </h3>

        <p class="text-muted mb-3">

          Price per person:

          <strong>
            ${{ destination?.price }}
          </strong>

        </p>


        <form
          class="booking-form"
          (ngSubmit)="confirmBooking()"
        >

          <!-- Start Date -->

          <div class="form-group">

            <label for="travelDate">
              Start Date
            </label>

            <input
              type="date"
              id="travelDate"
              name="travelDate"
              [(ngModel)]="travelDate"
              required
            />

          </div>


          <!-- End Date -->

          <div class="form-group">

            <label for="endDate">
              End Date
            </label>

            <input
              type="date"
              id="endDate"
              name="endDate"
              [(ngModel)]="endDate"
              required
            />

          </div>


          <!-- Travelers -->

          <div class="form-group">

            <label for="travelers">
              Number of Travelers
            </label>

            <input
              type="number"
              id="travelers"
              name="travelers"
              min="1"
              [(ngModel)]="travelers"
              required
            />

          </div>


          <!-- Itinerary -->

          <!-- <div class="form-group">

            <label for="itineraryDay">
              Itinerary Day
            </label>

            <select
              id="itineraryDay"
              name="itineraryDay"
              [(ngModel)]="selectedItineraryDayId"
              required
            >

              <option value="">
                Select itinerary day
              </option>


              <option
                *ngFor="let day of itineraryDays"
                [value]="day._id"
              >

                Day {{ day.DayNumber }}

                -

                {{ day.Title }}

              </option>

            </select>

          </div> -->


          <!-- Total Price + Button -->

          <div class="form-group full">

            <div class="total-price">

              <span>
                Total Price:
              </span>

              <strong>
                ${{ totalPrice }}
              </strong>

            </div>


            <button
              type="submit"
              class="confirm-btn"
              [disabled]="isBooking"
            >

              <span
                *ngIf="!isBooking"
              >
                Confirm Booking
              </span>


              <span
                *ngIf="isBooking"
              >
                Booking...
              </span>

            </button>

          </div>

        </form>

      </div>

    </div>

  </div>

</section>
