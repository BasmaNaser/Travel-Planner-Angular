<app-navbar></app-navbar>
<p></p>
<div class="min-vh-100 bg-light pt-5">
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold">My Complaints</h2>
        <p class="text-secondary mb-0">Messages and complaints you have submitted.</p>
      </div>
    </div>

    <div *ngIf="loading" class="text-center py-5">
      <div class="spinner-border" style="color:#0ea5a8;"></div>
    </div>

    <div *ngIf="!loading && errorMessage" class="alert alert-info">{{ errorMessage }}</div>

    <div *ngIf="!loading && complaints.length" class="row g-4">
      <div class="col-md-6 col-lg-4" *ngFor="let complaint of complaints">
        <div class="card h-100 border-0 shadow-sm rounded-4">
          <div class="card-body p-4">
            <h5 class="fw-bold">{{ complaint.subject }}</h5>
            <p class="text-secondary small mb-2">{{ complaint.createdAt | date:'medium' }}</p>
            <p class="mb-0">{{ complaint.message }}</p>
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="!loading && !complaints.length && !errorMessage" class="text-center py-5 text-secondary">
      No complaints yet.
    </div>
  </div>
</div>
<app-footer></app-footer>
